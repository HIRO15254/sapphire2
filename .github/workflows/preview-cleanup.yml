name: Preview Cleanup

on:
  pull_request:
    types: [ closed ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Closed PR whose preview to delete. Leave empty to only sweep the previews of PRs that are not open.
        required: false
        type: string
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: preview-deploy-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WORKER_PREFIX: sapphire2-api-pr-
  PROJECT_NAME: sapphire2-web
  D1_PREFIX: sapphire2-db-pr-

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve the closed PR
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -z "$PR" ]; then
            echo "No PR given; only sweeping the previews of PRs that are not open."
            exit 0
          fi
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number is not a PR number: ${PR}"
            exit 1
          fi
          STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" = "OPEN" ]; then
            echo "::error::PR #${PR} is open, so its preview is kept. Close it first."
            exit 1
          fi
          echo "number=${PR}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Delete preview resources
        id: cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_PATH: ${{ runner.temp }}/preview-cleanup.md
        run: bun scripts/preview-cleanup.ts

      - name: Write a report for a cleanup that did not finish
        if: always() && steps.target.outputs.number != '' && steps.cleanup.outcome != 'success'
        env:
          PR_NUMBER: ${{ steps.target.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_PATH: ${{ runner.temp }}/preview-cleanup.md
        run: |
          if [ -s "$REPORT_PATH" ]; then
            exit 0
          fi
          cat > "$REPORT_PATH" <<EOF
          ## Preview Environment

          > [!WARNING]
          > Preview cleanup did not finish, so every preview resource of this PR may still exist: Worker \`${WORKER_PREFIX}${PR_NUMBER}\`, Pages deployments of branch \`pr-${PR_NUMBER}\` in \`${PROJECT_NAME}\`, and D1 database \`${D1_PREFIX}${PR_NUMBER}\`.

          Read [the cleanup run](${RUN_URL}) to find the cause, fix it, and choose **Re-run failed jobs**. To delete the resources by hand instead, follow "Preview Cleanup Failure" in \`docs/deploy.md\`.
          EOF

      - name: Summarize
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/preview-cleanup.md
        run: |
          if [ -s "$REPORT_PATH" ]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Find preview comment
        if: always() && steps.target.outputs.number != ''
        uses: peter-evans/find-comment@v3
        id: find
        with:
          issue-number: ${{ steps.target.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: "Preview Environment"

      - name: Update preview comment
        if: always() && steps.target.outputs.number != '' && (steps.cleanup.outcome != 'success' || steps.find.outputs.comment-id != '')
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ steps.target.outputs.number }}
          edit-mode: replace
          body-path: ${{ runner.temp }}/preview-cleanup.md
