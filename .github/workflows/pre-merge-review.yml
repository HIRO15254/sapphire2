name: PR review

# Policy, data and mechanics: docs/design/pr-review.md
#   - at most MAX_AUTO_ROUNDS automatic rounds per PR (round 1 full, round 2
#     incremental on the next code push); further rounds via RE_REVIEW_LABEL
#   - a round starts only on the latest head and only after the `ci` check is
#     green, so author pushes cancel a waiting run instead of a running one
#   - release/* PRs whose tree equals dev are skipped (already reviewed on dev)
#   - the runner installs dependencies so the reviewer verifies instead of
#     guessing; the repo Stop hook is disabled for the review session

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  checks: read
  id-token: write

env:
  MAX_AUTO_ROUNDS: "2"
  RE_REVIEW_LABEL: re-review
  CI_CHECK_NAME: ci
  CI_WAIT_MINUTES: "30"

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      mode: ${{ steps.decide.outputs.mode }}
      round: ${{ steps.decide.outputs.round }}
      since_sha: ${{ steps.decide.outputs.since_sha }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Decide whether this event gets a review round
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --quiet origin dev
          head_tree=$(git rev-parse "${HEAD_SHA}^{tree}")
          dev_tree=$(git rev-parse "origin/dev^{tree}" 2>/dev/null || echo "")

          state_comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            | jq -s -c '[.[][] | select(.body | startswith("<!-- pre-merge-review:state")) | .body]')

          last_sha=$(STATE_COMMENTS="$state_comments" bun scripts/review-gate.ts last-sha)
          changed=null
          if [ -n "$last_sha" ] \
            && git cat-file -e "${last_sha}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$last_sha" "$HEAD_SHA"; then
            changed=$(git diff --name-only "$last_sha" "$HEAD_SHA" \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          GATE_INPUT=$(jq -n -c \
            --arg event "$EVENT_ACTION" \
            --arg label "$LABEL_NAME" \
            --argjson draft "$IS_DRAFT" \
            --arg headRef "$HEAD_REF" \
            --arg headSha "$HEAD_SHA" \
            --arg headTree "$head_tree" \
            --arg devTree "$dev_tree" \
            --argjson stateComments "$state_comments" \
            --argjson changedSinceLast "$changed" \
            --argjson maxAutoRounds "$MAX_AUTO_ROUNDS" \
            --arg reReviewLabel "$RE_REVIEW_LABEL" \
            '{
              event: $event,
              label: (if $label == "" then null else $label end),
              draft: $draft,
              headRef: $headRef,
              headSha: $headSha,
              headTree: $headTree,
              devTree: (if $devTree == "" then null else $devTree end),
              stateComments: $stateComments,
              changedSinceLast: $changedSinceLast,
              maxAutoRounds: $maxAutoRounds,
              reReviewLabel: $reReviewLabel
            }')
          export GATE_INPUT
          decision=$(bun scripts/review-gate.ts decide)
          {
            echo "### PR review gate"
            echo
            echo "- event: \`${EVENT_ACTION}\` head: \`${HEAD_SHA}\`"
            echo "- decision: $(printf '%s' "$decision" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Consume the re-review label
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${RE_REVIEW_LABEL}" \
            >/dev/null 2>&1 || true

      # Reviewing a red head wastes the run (the author is about to push a
      # lint/type fix) and lets the reviewer comment on failures CI already
      # reports. While this loop waits, a new push cancels the whole run
      # cheaply through the concurrency group.
      - name: Wait for the ci check on this head
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + CI_WAIT_MINUTES * 60 ))
          state=timeout
          while [ "$(date +%s)" -lt "$deadline" ]; do
            line=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=${CI_CHECK_NAME}&filter=latest" \
              --jq '.check_runs[0] | "\(.status // "none") \(.conclusion // "none")"' 2>/dev/null || echo "none none")
            status=${line% *}
            conclusion=${line#* }
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then state=success; else state=$conclusion; fi
              break
            fi
            sleep 30
          done
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "ci check '${CI_CHECK_NAME}' on ${HEAD_SHA}: ${state}"
          if [ "$state" != "success" ]; then
            echo "- review skipped: ci check is \`${state}\` on \`${HEAD_SHA}\`; the next code push re-evaluates" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.ci.outputs.state == 'success'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.ci.outputs.state == 'success'
        run: bun install --frozen-lockfile

      - name: Claude review
        id: claude_review
        if: steps.ci.outputs.state == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action creates and updates one tracking comment per run from
          # Claude's final message; Claude must not post the summary itself.
          track_progress: true
          # The repo Stop hook (ultracite fix + vitest --changed + check-rules)
          # is for authoring sessions; in a review it only burns runner time.
          settings: '{"disableAllHooks": true}'
          prompt: |
            You are the automated pre-merge reviewer for this repository.
            MODE=${{ needs.gate.outputs.mode }} ROUND=${{ needs.gate.outputs.round }} MAX_AUTO_ROUNDS=${{ env.MAX_AUTO_ROUNDS }} SINCE_SHA=${{ needs.gate.outputs.since_sha }}

            ## Environment
            - Dependencies are installed. Verify claims by running the scoped checks, never by
              assumption: `bunx vitest run --project <web-node|web-dom|api|server|db|mcp|env|scripts> <path>`,
              `bun run check-types`, `bun run check:rules`. Run only the projects the diff touches.
            - Never write that tests "could not be run" or that the environment is limited. If a
              command fails, quote its error once and move on.
            - Ignore the runner's working-tree state; review only committed history
              (`git diff <base>...<head>`), never `git status` output.
            - Library behaviour must be read from `node_modules` source or exercised in a test
              before it appears in a finding.

            ## Severity (mandatory tag as the first token of every inline comment: `**[critical]**` … `**[nit]**`)
            - critical / high: security gap, data loss or corruption, a migration that can stop production.
            - medium: wrong behaviour a user or an MCP client will hit (including a tool description
              that makes a model issue a failing or data-losing call), or a missing test for a fixed bug.
            - low: real but cosmetic or edge-case behaviour; a missing guard with no observed failure.
            - nit: style, naming, wording, defensive-coding preference. Post nits in the summary list
              only, never as inline comments.
            - `**[unverified]**`: a suspicion you could not confirm by reading source or running a
              test. It carries no severity, never blocks, and must include the exact command or
              test the author can run to settle it. Prefer settling it yourself.

            ## Scope rules
            - Do not comment on prose (docs/design, AGENTS.md, rule files, code comments, commit
              messages) unless it is factually wrong against the code. Wording is never a finding.
            - Do not propose refactors or alternative designs unless the current one is defective.
            - If MODE=full: run the `/code-review medium` skill on this PR and keep its whole
              pipeline (parallel finders, one independent verifier per candidate that returns
              CONFIRMED / PLAUSIBLE / REFUTED, a final sweep for gaps). Drop REFUTED candidates.
              Then apply the severity, scope and output rules of this prompt to what survives:
              map the skill's severities onto the rubric above before posting. Also read the
              `.claude/rules/*.md` files that match the touched paths and AGENTS.md, and check the
              MCP coupling rule when `packages/api` changed; rule violations go through the same
              verifier before they are posted.
            - If MODE=incremental: the PR was reviewed at SINCE_SHA. Review only
              `git diff ${{ needs.gate.outputs.since_sha }}...HEAD` plus the direct callers of functions that diff changed
              (find them with `rg`). Do not re-review unchanged code. Start by settling every
              existing inline thread from the previous round: fixed / not addressed / declined.
              Before posting any new finding, hand it to one verifier subagent (Task) with the
              diff, the relevant files and the candidate; it returns CONFIRMED / PLAUSIBLE /
              REFUTED. Drop REFUTED. A PLAUSIBLE finding you cannot settle by running a test is
              posted as `[unverified]`. New inline comments are allowed only for (a) a regression
              introduced by the fix, or (b) medium or higher in the new diff. Low and nit
              findings on new code go into the summary list only.

            ## Output
            Post inline comments with `mcp__github_inline_comment__create_inline_comment` for
            findings of severity low or higher (full mode) / per the incremental rules above.
            Do NOT run `gh pr comment`; the tracking comment is created from your final message.
            Your final message is the summary and must follow this template exactly, in Japanese,
            with nothing before or after it:

            ### Verdict: approve | changes-requested
            One sentence on why. `changes-requested` only when a medium or higher finding is open.

            ### Findings
            A table `| # | severity | location | one-line summary |` — inline-commented findings
            first, then nits. Omit the table when there are none.

            ### Previous round (incremental mode only)
            A table `| finding | status |` with status fixed / not addressed / declined. Nothing else.

            ### Checked (full mode only)
            One line, at most 120 characters, naming the areas you verified (e.g. auth, migration
            0051, MCP registry). No per-item prose.

            Hard limits: no "verified and fine" lists, no "not executed" section, no restating the
            PR description, no compliments, no closing remarks. Keep the whole message under
            40 lines. When ROUND >= MAX_AUTO_ROUNDS and something remains open, add exactly one
            line: 次の自動レビューはありません。必要なら `${{ env.RE_REVIEW_LABEL }}` ラベルで要求してください。
          # max-turns is a runaway guard, not a budget (a truncated run still
          # costs the tokens and produces nothing). allowedTools: everything
          # else is denied and each denial burns a turn. Skill loads
          # /code-review (alias /review); Task/Agent are its finder and
          # verifier subagents; ReportFindings is the tool it submits to.
          # `gh api` stays out because the diff is untrusted input and the
          # token can write to PRs.
          claude_args: |
            --max-turns 80
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Skill,Task,Agent,TodoWrite,ReportFindings,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(rg:*),Bash(bunx vitest run:*),Bash(bunx vitest related:*),Bash(bun run check-types),Bash(bun run check:rules),Bash(bun run lint),Bash(bun x ultracite check:*)"

      - name: Record the round
        if: steps.claude_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROUNDS: ${{ needs.gate.outputs.round }}
          LAST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bun scripts/review-gate.ts render-state > "${RUNNER_TEMP}/review-state.md"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pre-merge-review:state")) | .id' | tail -n 1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F "body=@${RUNNER_TEMP}/review-state.md" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${RUNNER_TEMP}/review-state.md" >/dev/null
          fi

      # Hitting the turn cap leaves the tracking comment as an empty checklist
      # with no verdict, which reads exactly like "the review found nothing".
      - name: Report truncated review
        if: failure() && steps.claude_review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log_file="$EXECUTION_FILE"
          if [ ! -f "$log_file" ]; then
            log_file="${RUNNER_TEMP}/claude-execution-output.json"
          fi

          subtype=""
          if [ -f "$log_file" ]; then
            subtype=$(jq -rs '[.. | objects | select(.type == "result")] | last | .subtype // empty' "$log_file" 2>/dev/null || true)
          fi

          if [ "$subtype" != "error_max_turns" ]; then
            echo "review failed with subtype='${subtype:-unknown}' (not a turn-limit cutoff); nothing to report."
            exit 0
          fi

          {
            cat <<'EOF'
          <!-- pre-merge-review:truncated -->
          ### ⚠️ 自動レビューはターン上限で打ち切られました

          `review` ジョブが Claude のターン上限に達したため、レビューを最後まで実行できませんでした。

          - インラインコメントが付いていても **レビューは網羅的ではありません**
          - 要約は投稿されていないため、上のチェックリストが空でも「指摘なし」ではありません
          - マージ可否は `ci` の結果と人手のレビューで判断してください

          再実行する場合はこのジョブを re-run してください。
          EOF
            printf '\n[View job run](%s)\n' "$RUN_URL"
          } > "${RUNNER_TEMP}/review-truncated.md"

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pre-merge-review:truncated -->")) | .id' | tail -n 1 || true)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F "body=@${RUNNER_TEMP}/review-truncated.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${RUNNER_TEMP}/review-truncated.md"
          fi
