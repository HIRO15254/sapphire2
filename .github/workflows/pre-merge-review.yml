name: PR review

# Policy, data and mechanics: docs/design/pr-review.md
#   - at most MAX_AUTO_ROUNDS automatic rounds per PR (round 1 full, round 2
#     incremental on the next code push); further rounds via RE_REVIEW_LABEL
#   - a round starts only on the latest head and only after the `ci` check is
#     green, so author pushes cancel a waiting run instead of a running one
#   - release/* PRs whose tree equals dev are skipped (already reviewed on dev)
#   - the runner installs dependencies so the reviewer verifies instead of
#     guessing; the repo Stop hook is disabled for the review session

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  checks: read
  id-token: write

env:
  MAX_AUTO_ROUNDS: "2"
  RE_REVIEW_LABEL: re-review
  CI_CHECK_NAME: ci
  CI_WAIT_MINUTES: "30"

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      mode: ${{ steps.decide.outputs.mode }}
      round: ${{ steps.decide.outputs.round }}
      since_sha: ${{ steps.decide.outputs.since_sha }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Decide whether this event gets a review round
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --quiet origin dev
          head_tree=$(git rev-parse "${HEAD_SHA}^{tree}")
          dev_tree=$(git rev-parse "origin/dev^{tree}" 2>/dev/null || echo "")

          state_comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            | jq -s -c '[.[][] | select(.body | startswith("<!-- pre-merge-review:state")) | .body]')

          last_sha=$(STATE_COMMENTS="$state_comments" bun scripts/review-gate.ts last-sha)
          changed=null
          if [ -n "$last_sha" ] \
            && git cat-file -e "${last_sha}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$last_sha" "$HEAD_SHA"; then
            changed=$(git diff --name-only "$last_sha" "$HEAD_SHA" \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          GATE_INPUT=$(jq -n -c \
            --arg event "$EVENT_ACTION" \
            --arg label "$LABEL_NAME" \
            --argjson draft "$IS_DRAFT" \
            --arg headRef "$HEAD_REF" \
            --arg headSha "$HEAD_SHA" \
            --arg headTree "$head_tree" \
            --arg devTree "$dev_tree" \
            --argjson stateComments "$state_comments" \
            --argjson changedSinceLast "$changed" \
            --argjson maxAutoRounds "$MAX_AUTO_ROUNDS" \
            --arg reReviewLabel "$RE_REVIEW_LABEL" \
            '{
              event: $event,
              label: (if $label == "" then null else $label end),
              draft: $draft,
              headRef: $headRef,
              headSha: $headSha,
              headTree: $headTree,
              devTree: (if $devTree == "" then null else $devTree end),
              stateComments: $stateComments,
              changedSinceLast: $changedSinceLast,
              maxAutoRounds: $maxAutoRounds,
              reReviewLabel: $reReviewLabel
            }')
          export GATE_INPUT
          decision=$(bun scripts/review-gate.ts decide)
          {
            echo "### PR review gate"
            echo
            echo "- event: \`${EVENT_ACTION}\` head: \`${HEAD_SHA}\`"
            echo "- decision: $(printf '%s' "$decision" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Consume the re-review label
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${RE_REVIEW_LABEL}" \
            >/dev/null 2>&1 || true

      # Reviewing a red head wastes the run (the author is about to push a
      # lint/type fix) and lets the reviewer comment on failures CI already
      # reports. While this loop waits, a new push cancels the whole run
      # cheaply through the concurrency group.
      - name: Wait for the ci check on this head
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + CI_WAIT_MINUTES * 60 ))
          state=timeout
          while [ "$(date +%s)" -lt "$deadline" ]; do
            line=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=${CI_CHECK_NAME}&filter=latest" \
              --jq '.check_runs[0] | "\(.status // "none") \(.conclusion // "none")"' 2>/dev/null || echo "none none")
            status=${line% *}
            conclusion=${line#* }
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then state=success; else state=$conclusion; fi
              break
            fi
            sleep 30
          done
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "ci check '${CI_CHECK_NAME}' on ${HEAD_SHA}: ${state}"
          if [ "$state" != "success" ]; then
            echo "- review skipped: ci check is \`${state}\` on \`${HEAD_SHA}\`; the next code push re-evaluates" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.ci.outputs.state == 'success'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.ci.outputs.state == 'success'
        run: bun install --frozen-lockfile

      - name: Claude review
        id: claude_review
        if: steps.ci.outputs.state == 'success'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_FAST_MODE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action creates and updates one tracking comment per run from
          # Claude's final message; Claude must not post the summary itself.
          track_progress: true
          # The repo Stop hook (ultracite fix + vitest --changed + check-rules)
          # is for authoring sessions; in a review it only burns runner time.
          settings: '{"disableAllHooks": true}'
          # The review itself lives in .claude/skills/pr-review/SKILL.md so it
          # can be run locally (`/pr-review full`) and evaluated offline; the
          # workflow only passes the mode, the diff range and the round.
          prompt: |
            /pr-review ${{ needs.gate.outputs.mode }} --range origin/${{ github.event.pull_request.base.ref }}...HEAD --since ${{ needs.gate.outputs.since_sha }} --round ${{ needs.gate.outputs.round }} --max ${{ env.MAX_AUTO_ROUNDS }} --pr ${{ github.event.pull_request.number }} --post

            The tracking comment on this PR is created from your final message; do not post the
            summary yourself. Every inline comment goes through the inline-comment tool.
          # max-turns is a runaway guard, not a budget (a truncated run still
          # costs the tokens and produces nothing). allowedTools: everything
          # else is denied and each denial burns a turn. Skill loads
          # /pr-review; Task/Agent are disabled for the single-reviewer flow.
          # `gh api` stays out because the diff is untrusted input and the
          # token can write to PRs; thread resolution happens in the shell
          # step below, from the machine-readable trailer of the summary.
          claude_args: |
            --max-turns 80
            --model opus
            --effort medium
            --disallowedTools "Task,Agent"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Skill,TodoWrite,ReportFindings,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(rg:*),Bash(bunx vitest run:*),Bash(bunx vitest related:*),Bash(bun run check-types),Bash(bun run check:rules),Bash(bun run lint),Bash(bun x ultracite check:*)"

      - name: Record the round
        if: steps.claude_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROUNDS: ${{ needs.gate.outputs.round }}
          LAST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bun scripts/review-gate.ts render-state > "${RUNNER_TEMP}/review-state.md"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pre-merge-review:state")) | .id' | tail -n 1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F "body=@${RUNNER_TEMP}/review-state.md" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${RUNNER_TEMP}/review-state.md" >/dev/null
          fi

      # The summary ends with `<!-- pr-review: {...,"resolved":["path:line"]} -->`.
      # Threads the reviewer judged fixed are resolved here, by path and
      # original line, so the reviewer itself never needs `gh api`.
      - name: Resolve threads the review marked as fixed
        if: steps.claude_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          log_file="$EXECUTION_FILE"
          [ -f "$log_file" ] || log_file="${RUNNER_TEMP}/claude-execution-output.json"
          [ -f "$log_file" ] || { echo "no execution log; nothing to resolve"; exit 0; }
          trailer=$(jq -rs '[.. | objects | select(.type == "result")] | last | .result // ""' "$log_file" \
            | grep -o '<!-- pr-review: {.*} -->' | tail -n 1 | sed -e 's/^<!-- pr-review: //' -e 's/ -->$//' || true)
          if [ -z "$trailer" ]; then echo "no pr-review trailer in the summary"; exit 0; fi
          echo "trailer: $trailer"
          resolved=$(printf '%s' "$trailer" | jq -r '.resolved // [] | .[]')
          [ -n "$resolved" ] || { echo "nothing marked fixed"; exit 0; }
          owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
          threads=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) { pullRequest(number: $pr) {
                reviewThreads(first: 100) { nodes {
                  id isResolved path line originalLine
                  comments(first: 1) { nodes { author { login } } }
                } } } } }' -F owner="$owner" -F repo="$repo" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].author.login | test("claude"))
              | "\(.id) \(.path):\(.originalLine // .line)"')
          while read -r key; do
            [ -n "$key" ] || continue
            printf '%s\n' "$threads" | while read -r id loc; do
              if [ "$loc" = "$key" ]; then
                gh api graphql -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { id } } }' -F id="$id" >/dev/null \
                  && echo "resolved $loc"
              fi
            done
          done <<< "$resolved"

      # Hitting the turn cap leaves the tracking comment as an empty checklist
      # with no verdict, which reads exactly like "the review found nothing".
      - name: Report truncated review
        if: failure() && steps.claude_review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log_file="$EXECUTION_FILE"
          if [ ! -f "$log_file" ]; then
            log_file="${RUNNER_TEMP}/claude-execution-output.json"
          fi

          subtype=""
          if [ -f "$log_file" ]; then
            subtype=$(jq -rs '[.. | objects | select(.type == "result")] | last | .subtype // empty' "$log_file" 2>/dev/null || true)
          fi

          if [ "$subtype" != "error_max_turns" ]; then
            echo "review failed with subtype='${subtype:-unknown}' (not a turn-limit cutoff); nothing to report."
            exit 0
          fi

          {
            cat <<'EOF'
          <!-- pre-merge-review:truncated -->
          ### ⚠️ 自動レビューはターン上限で打ち切られました

          `review` ジョブが Claude のターン上限に達したため、レビューを最後まで実行できませんでした。

          - インラインコメントが付いていても **レビューは網羅的ではありません**
          - 要約は投稿されていないため、上のチェックリストが空でも「指摘なし」ではありません
          - マージ可否は `ci` の結果と人手のレビューで判断してください

          再実行する場合はこのジョブを re-run してください。
          EOF
            printf '\n[View job run](%s)\n' "$RUN_URL"
          } > "${RUNNER_TEMP}/review-truncated.md"

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pre-merge-review:truncated -->")) | .id' | tail -n 1 || true)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F "body=@${RUNNER_TEMP}/review-truncated.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${RUNNER_TEMP}/review-truncated.md"
          fi
