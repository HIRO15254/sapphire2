name: CI

on:
  pull_request:
    branches: [dev, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Tokyo

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run check:testing-types
      - run: bun run lint
      - run: bun run check:rules
      - run: bun run check:test-discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-discovery
          path: test-results/discovery.json

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage --reporter=default --reporter=junit --reporter=json --outputFile.junit=test-results/vitest.xml --outputFile.json=test-results/vitest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-and-coverage
          path: |
            test-results/
            coverage/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:integration --reporter=default --reporter=junit --outputFile=test-results/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-integration-tests
          path: test-results/

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # Vitest skips these bun:sqlite bodies; check-rules verifies these paths.
      - name: Test migrations with Bun SQLite
        run: |
          bun test \
            packages/db/src/__tests__/migration-*.test.ts \
            packages/db/src/__tests__/preview-seed-restore.test.ts \
            --reporter=junit --reporter-outfile=migrations.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-tests
          path: migrations.xml

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-tests
          path: |
            test-results/
            playwright-report/

  ci:
    if: always()
    needs: [static, unit, integration, migrations, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success,success"
