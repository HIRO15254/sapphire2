name: Setup
description: Install the pinned Node.js (.node-version) and Bun (package.json packageManager), then the locked dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash
